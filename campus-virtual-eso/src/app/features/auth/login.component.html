<div class="login-container">
  <div class="login-card">
    <!-- Header -->
    <div class="login-header">
      <h1>Campus Virtual ESO</h1>
      <p>Inicia sesión para acceder a tu campus</p>
    </div>

    <!-- Error Message -->
    @if (error()) {
      <div class="error-message">
        <i class="error-icon">⚠️</i>
        {{ error() }}
      </div>
    }

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <!-- Email Field -->
      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="tu@email.com"
          [class.error]="emailError()"
          autocomplete="email"
        />
        @if (emailError()) {
          <span class="field-error">{{ emailError() }}</span>
        }
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="password-input">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            placeholder="Tu contraseña"
            [class.error]="passwordError()"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="toggle-password"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            {{ showPassword() ? '👁️' : '👁️‍🗨️' }}
          </button>
        </div>
        @if (passwordError()) {
          <span class="field-error">{{ passwordError() }}</span>
        }
      </div>

      <!-- Remember Me -->
      <div class="form-options">
        <label class="checkbox-label">
          <input
            type="checkbox"
            [checked]="rememberMe()"
            (change)="toggleRememberMe()"
          />
          <span class="checkmark"></span>
          Recordar email
        </label>
        <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="login-button"
        [disabled]="!isFormValid() || isLoading()"
      >
        @if (isLoading()) {
          <span class="loading-spinner"></span>
          Iniciando sesión...
        } @else {
          Iniciar Sesión
        }
      </button>
    </form>

    <!-- Quick Login (Development) -->
    <div class="quick-login">
      <p>Login rápido (Desarrollo):</p>
      <div class="quick-login-buttons">
        <button
          type="button"
          class="quick-btn student"
          (click)="quickLogin('student')"
          [disabled]="isLoading()"
        >
          👨‍🎓 Estudiante
        </button>
        <button
          type="button"
          class="quick-btn teacher"
          (click)="quickLogin('teacher')"
          [disabled]="isLoading()"
        >
          👨‍🏫 Profesor
        </button>
        <button
          type="button"
          class="quick-btn admin"
          (click)="quickLogin('admin')"
          [disabled]="isLoading()"
        >
          👨‍💼 Admin
        </button>
      </div>
    </div>

    <!-- Register Link -->
    <div class="register-link">
      <p>
        ¿No tienes cuenta?
        <button type="button" class="link-button" (click)="goToRegister()">
          Regístrate aquí
        </button>
      </p>
    </div>
  </div>
</div>
